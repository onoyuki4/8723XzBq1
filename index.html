<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gallery</title>
  <style>
    /* --- 기본 스타일 --- */
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 1rem; }
    h1 { text-align: center; cursor: pointer; /* 제목 클릭 시 전체 보기 */ }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; max-width: 1000px; margin: auto; min-height: 300px; /* 내용 없을 때 최소 높이 */}
    .work { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column; }
    .work a { text-decoration: none; color: inherit; display: block; flex-grow: 1; /* 링크가 카드 전체 차지 */}
    .work:hover { transform: scale(1.02); }
    .work .info-top { padding: 0.75rem; text-align: left; }
    .work .title { font-weight: bold; font-size: 0.95em; display: block; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .work .author { font-size: 0.85em; color: #555; cursor: pointer; display: inline-block; }
    .work .author:hover { text-decoration: underline; color: #007bff; }
    .work img { width: 100%; height: 250px; object-fit: cover; display: block; border-top: 1px solid #eee; margin-top: auto; /* 이미지를 아래로 밀착 */}

    /* --- 검색창 스타일 --- */
    #search-container {
        max-width: 1000px;
        margin: 1rem auto;
        padding: 10px;
        background-color: #eee;
        border-radius: 5px;
        text-align: center;
    }
    #search-input {
        padding: 8px;
        margin-right: 5px;
        border: 1px solid #ccc;
        border-radius: 3px;
        min-width: 250px;
    }
    #search-button, #clear-search-button {
        padding: 8px 12px;
        cursor: pointer;
        border: none;
        border-radius: 3px;
        background-color: #007bff;
        color: white;
        vertical-align: middle;
    }
    #clear-search-button {
        background-color: #6c757d;
        margin-left: 5px;
    }

    /* --- 필터링/검색 결과 안내 메시지 스타일 --- */
    .info-message { text-align: center; margin: 1rem 0; font-weight: bold; }
    .info-message button { margin-left: 0.5rem; padding: 5px 10px; cursor: pointer; }
    #no-results-message { text-align: center; margin-top: 20px; color: #777; padding: 2rem;} /* 검색 결과 없을 때 */

    /* --- 페이지네이션 스타일 --- */
    .pagination {
        text-align: center;
        margin-top: 2rem;
        padding: 1rem 0;
        user-select: none; /* 드래그 선택 방지 */
    }
    .pagination button {
        background-color: #fff;
        border: 1px solid #ccc;
        padding: 0.5rem 0.75rem;
        margin: 0 0.2rem;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.2s, color 0.2s;
    }
    .pagination button:hover:not(:disabled) {
        background-color: #eee;
    }
    .pagination button.active {
        background-color: #007bff;
        color: white;
        border-color: #007bff;
        font-weight: bold;
        cursor: default;
    }
    .pagination button:disabled:not(.active) { /* 현재 페이지 아닌 비활성 버튼 */
        background-color: #e9ecef;
        color: #6c757d;
        cursor: not-allowed;
        opacity: 0.65;
    }
    /* 페이지 번호가 많을 때 생략(...) 표시 스타일 */
    .pagination .ellipsis {
        display: inline-block;
        padding: 0.5rem 0.3rem;
        margin: 0 0.2rem;
        color: #6c757d;
    }
  </style>
</head>
<body>
  <h1 id="main-title">Local Hitomi</h1>

  <!-- 검색창 -->
  <div id="search-container">
      <input type="search" id="search-input" placeholder="제목 또는 작가 검색...">
      <button id="search-button">검색</button>
      <button id="clear-search-button" style="display: none;">검색 지우기</button>
  </div>

  <!-- 필터링 정보 표시 영역 -->
  <div id="filter-info-container"></div>

  <!-- 갤러리 컨테이너 -->
  <div class="gallery" id="gallery-container">
    <!-- 작품 목록 및 결과 없음 메시지는 JS로 채워짐 -->
  </div>

  <!-- ================================== -->
  <!-- === 페이지네이션 컨트롤 영역 (중요!) === -->
  <!-- ================================== -->
  <div id="pagination-controls" class="pagination">
      <!-- 페이지 번호 버튼은 JS로 채워짐 -->
  </div>
  <!-- ================================== -->

  <!-- ================================== -->
  <!-- === 작품 목록 데이터 로드 (중요!) === -->
  <!-- ================================== -->
  <script src="works-list.js"></script>
  <!-- ================================== -->

  <!-- ================================== -->
  <!-- === 메인 자바스크립트 코드 === -->
  <!-- ================================== -->
  <script>
    // ========================================
    // === 전역 변수 및 설정 ===
    // ========================================
    const galleryContainer = document.getElementById('gallery-container');
    const mainTitle = document.getElementById('main-title');
    const filterInfoContainer = document.getElementById('filter-info-container');
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const clearSearchButton = document.getElementById('clear-search-button');
    // ▼▼▼ 이 변수는 반드시 위의 <div id="pagination-controls"> 가 존재해야 null이 안됩니다. ▼▼▼
    const paginationControls = document.getElementById('pagination-controls');

    // ⭐⭐⭐ 로컬 스토리지 키 정의 ⭐⭐⭐
    const STORAGE_KEY_SEARCH = 'gallerySearchTerm';
    const STORAGE_KEY_AUTHOR = 'galleryAuthorFilter';

    // ⭐⭐⭐ 외부 이미지 호스팅 기본 URL 설정 (이전에 추가한 부분) ⭐⭐⭐
    const baseImageUrl = 'https://pub-2762a42350fa43fba86173c9f291ebcd.r2.dev/'; // 👈 본인의 R2 공개 URL 확인!

    const itemsPerPage = 16; // 페이지당 항목 수
    let currentPage = 1; // 현재 페이지 번호
    let currentDataSet = []; // 현재 화면에 표시할 전체 데이터셋
    let currentFilter = null; // 현재 필터링 중인 작가 이름

    // ========================================
    // === 갤러리 렌더링 ===
    // ========================================
    function renderGallery() {
        // ▼▼▼ 이 함수가 제대로 실행되려면 먼저 works-list.js가 로드되어 worksData가 정의되어야 합니다. ▼▼▼
        if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
            if (galleryContainer) galleryContainer.innerHTML = '<p id="no-results-message">작품 데이터를 불러올 수 없습니다. (works-list.js 확인 필요)</p>';
            console.error("CRITICAL: worksData is not defined or not an array! Check works-list.js file presence and content on GitHub.");
            // 페이지네이션 컨트롤도 비활성화/숨김 처리 필요 시 추가
            if (paginationControls) paginationControls.innerHTML = ''; // 오류 시 페이지네이션도 비움
            return; // 여기서 멈춤
        }

        // galleryContainer가 null이 아닌지 확인 (HTML 구조 문제 시 대비)
        if (!galleryContainer) {
            console.error("CRITICAL: galleryContainer element not found!");
            return;
        }
        galleryContainer.innerHTML = ''; // 내용 비우기

        updateFilterInfo(); // 필터 정보 업데이트

        // currentDataSet 유효성 검사 강화
        if (!Array.isArray(currentDataSet)) {
             console.warn("currentDataSet was not an array, resetting.", currentDataSet);
             currentDataSet = [...worksData]; // 문제가 있으면 전체 데이터로 복구
        }

        const totalItems = currentDataSet.length;
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = currentDataSet.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            let message = '표시할 작품이 없습니다.';
            if (currentFilter) message = `<strong>'${currentFilter}'</strong> 작가의 작품이 없습니다. <button onclick="showAllWorks()">전체 보기</button>`;
            else if (searchInput.value.trim()) message = `<strong>'${searchInput.value.trim()}'</strong>에 대한 검색 결과가 없습니다. <button onclick="showAllWorks()">전체 보기</button>`;
            galleryContainer.innerHTML = `<p id="no-results-message">${message}</p>`;
        } else {
            pageData.forEach(work => {
            // work 객체 유효성 검사 추가 (id, title, author 정도만 확인)
            if (!work || typeof work.id === 'undefined' || typeof work.title === 'undefined' || typeof work.author === 'undefined') {
                console.error("Invalid work item found in dataset:", work);
                return; // 문제가 있는 항목은 건너뜀
            }
            try {
                const workDiv = document.createElement('div');
                workDiv.className = 'work';
                const link = document.createElement('a');
                link.href = `works/${work.id}/index.html`;
                const infoDiv = document.createElement('div');
                infoDiv.className = 'info-top';
                const titleSpan = document.createElement('span');
                titleSpan.className = 'title';
                titleSpan.textContent = work.title;
                titleSpan.title = work.title; // 툴팁용
                const authorSpan = document.createElement('span');
                authorSpan.className = 'author';
                authorSpan.textContent = work.author;
                authorSpan.dataset.author = work.author;
                authorSpan.addEventListener('click', handleAuthorClick);
                infoDiv.appendChild(titleSpan);
                infoDiv.appendChild(authorSpan);
                const img = document.createElement('img');
                if (work.firstImage) {
                    img.src = `${baseImageUrl}works/${work.id}/${work.firstImage}`;
                } else {
                    img.src = ''; // 또는 대체 이미지 경로
                    console.warn(`Work item ${work.id} has no firstImage defined.`);
                }
                img.alt = `${work.title} / ${work.author}`;
                img.loading = 'lazy';
                img.onerror = function() { console.error("Failed to load image:", this.src); this.src=''; this.style.display='none'; };
                link.appendChild(infoDiv);
                link.appendChild(img);
                workDiv.appendChild(link);
                galleryContainer.appendChild(workDiv);
            } catch (error) {
                console.error("Error rendering work item:", work, error);
            }
            });
        }
        // ▼▼▼ paginationControls가 null이면 오류 발생하므로 확인 ▼▼▼
        if (paginationControls) {
            renderPaginationControls();
        } else {
            console.error("Cannot render pagination: paginationControls element not found!");
        }
    }

    // ========================================
    // === 페이지네이션 컨트롤 렌더링 (개선된 버전) ===
    // ========================================
    function renderPaginationControls() {
        // ▼▼▼ 함수 시작 시 paginationControls 유효성 재확인 ▼▼▼
        if (!paginationControls) {
             console.error("renderPaginationControls called but paginationControls element is missing!");
             return;
        }
        paginationControls.innerHTML = ''; // 내용 비우기

        // worksData 유효성 검사 추가
        if (typeof worksData === 'undefined' || !Array.isArray(worksData) || !Array.isArray(currentDataSet)) {
             console.warn("renderPaginationControls: worksData or currentDataSet is invalid.");
             return; // 데이터 없으면 중단
        }

        const totalItems = currentDataSet.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage);

        if (totalPages <= 1) return; // 페이지 1개 이하면 표시 안 함

        const createButton = (text, pageNum, isDisabled = false, isCurrent = false, isEllipsis = false) => {
            if (isEllipsis) {
                const span = document.createElement('span');
                span.className = 'ellipsis';
                span.textContent = '...';
                return span;
            }
            const button = document.createElement('button');
            button.textContent = text;
            button.disabled = isDisabled || isCurrent;
            if (isCurrent) button.classList.add('active');
            // changePage 함수 존재 확인 후 호출 (안전장치)
            if (typeof changePage === 'function') {
                button.onclick = () => changePage(pageNum);
            }
            return button;
        };

        paginationControls.appendChild(createButton('이전', currentPage - 1, currentPage === 1));

        const maxPageButtons = 5;
        let startPage, endPage;

        if (totalPages <= maxPageButtons) {
            startPage = 1; endPage = totalPages;
        } else {
            const maxPagesBeforeCurrent = Math.floor((maxPageButtons - 1) / 2);
            const maxPagesAfterCurrent = Math.ceil((maxPageButtons - 1) / 2);
            if (currentPage <= maxPagesBeforeCurrent) {
                startPage = 1; endPage = maxPageButtons;
            } else if (currentPage + maxPagesAfterCurrent >= totalPages) {
                startPage = totalPages - maxPageButtons + 1; endPage = totalPages;
            } else {
                startPage = currentPage - maxPagesBeforeCurrent; endPage = currentPage + maxPagesAfterCurrent;
            }
        }

        if (startPage > 1) {
            paginationControls.appendChild(createButton('1', 1));
            if (startPage > 2) paginationControls.appendChild(createButton('...', 0, false, false, true));
        }
        for (let i = startPage; i <= endPage; i++) {
            paginationControls.appendChild(createButton(i, i, false, i === currentPage));
        }
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) paginationControls.appendChild(createButton('...', 0, false, false, true));
            paginationControls.appendChild(createButton(totalPages, totalPages));
        }

        paginationControls.appendChild(createButton('다음', currentPage + 1, currentPage === totalPages));
    }


    // ========================================
    // === 페이지 변경 ===
    // ========================================
    function changePage(newPage) {
        // currentDataSet 유효성 검사 추가
        const totalPages = Math.ceil(((currentDataSet && currentDataSet.length) || 0) / itemsPerPage);
        if (newPage >= 1 && newPage <= totalPages) {
            currentPage = newPage;
            // renderGallery 함수 존재 확인 후 호출
            if (typeof renderGallery === 'function') {
                renderGallery();
            }
            // galleryContainer 존재 확인 후 스크롤
            if (galleryContainer) {
                const galleryTop = galleryContainer.offsetTop - 20;
                window.scrollTo({ top: galleryTop, behavior: 'smooth' });
            }
        }
    }

    // ========================================
    // === 데이터 필터링/검색/전체보기 ===
    // ========================================
    function updateDataSet(newDataSet) {
      currentDataSet = newDataSet || []; // null/undefined 방지
      currentPage = 1;
      if (typeof renderGallery === 'function') renderGallery();
    }

    // ⭐⭐⭐ 함수 수정: saveState 파라미터 추가 ⭐⭐⭐
    function filterGalleryByAuthor(authorName, saveState = true) {
      currentFilter = authorName;
      if(searchInput) searchInput.value = ''; // null 체크 추가
      if(clearSearchButton) clearSearchButton.style.display = 'none';

      if (typeof worksData !== 'undefined' && Array.isArray(worksData)) {
        updateDataSet(worksData.filter(work => work && work.author === authorName)); // work null 체크 추가
      } else { console.error("Cannot filter: worksData is not defined."); }

      if (saveState) {
        try {
          localStorage.setItem(STORAGE_KEY_AUTHOR, authorName);
          localStorage.removeItem(STORAGE_KEY_SEARCH);
          console.log('Author filter state saved:', authorName);
        } catch (e) { console.error("Failed to save state to localStorage", e); }
      }
      if (typeof updateFilterInfo === 'function') updateFilterInfo();
    }

    // ⭐⭐⭐ 함수 수정: saveState 파라미터 추가 ⭐⭐⭐
    function performSearch(saveState = true) {
      if (!searchInput) return; // searchInput 없으면 중단
      const searchTerm = searchInput.value.trim().toLowerCase();
      currentFilter = null;

      if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
          console.error("Cannot search: worksData is not defined."); return;
      }

      if (!searchTerm) {
        if (typeof showAllWorks === 'function') showAllWorks();
        return;
      }

      const filtered = worksData.filter(work =>
          work && // work null 체크 추가
          ( (work.title && work.title.toLowerCase().includes(searchTerm)) ||
            (work.author && work.author.toLowerCase().includes(searchTerm)) )
      );
      updateDataSet(filtered);
      if(clearSearchButton) clearSearchButton.style.display = 'inline-block';

      if (saveState) {
          try {
            localStorage.setItem(STORAGE_KEY_SEARCH, searchInput.value.trim());
            localStorage.removeItem(STORAGE_KEY_AUTHOR);
            console.log('Search state saved:', searchInput.value.trim());
          } catch (e) { console.error("Failed to save state to localStorage", e); }
      }
      if (typeof updateFilterInfo === 'function') updateFilterInfo();
    }

    // ⭐⭐⭐ 함수 수정: 로컬 스토리지 초기화 추가 ⭐⭐⭐
    function showAllWorks() {
      currentFilter = null;
      if(searchInput) searchInput.value = '';
      if(clearSearchButton) clearSearchButton.style.display = 'none';

      try {
        localStorage.removeItem(STORAGE_KEY_SEARCH);
        localStorage.removeItem(STORAGE_KEY_AUTHOR);
        console.log('Saved search/filter state cleared.');
      } catch (e) { console.error("Failed to clear state from localStorage", e); }


      if (typeof worksData !== 'undefined' && Array.isArray(worksData)) {
        updateDataSet([...worksData]); // 원본 복사해서 사용
      } else { console.error("Cannot show all: worksData is not defined."); }
      if (typeof updateFilterInfo === 'function') updateFilterInfo();
    }

    // ========================================
    // === 이벤트 핸들러 ===
    // ========================================
    function handleAuthorClick(event) {
      event.preventDefault();
      event.stopPropagation();
      const author = event.target.dataset.author;
      if (author && typeof filterGalleryByAuthor === 'function') {
          filterGalleryByAuthor(author);
      }
    }

    // ========================================
    // === 필터링 정보 표시 업데이트 ===
    // ========================================
    function updateFilterInfo() {
      if (!filterInfoContainer) return; // 요소 없으면 중단
      filterInfoContainer.innerHTML = '';
      if (currentFilter) {
        const infoP = document.createElement('p');
        infoP.className = 'info-message';
        infoP.innerHTML = `<strong>${currentFilter}</strong> 작가 작품만 보는 중`;
        const showAllButton = document.createElement('button');
        showAllButton.textContent = '전체 보기';
        if (typeof showAllWorks === 'function') showAllButton.onclick = showAllWorks;
        infoP.appendChild(showAllButton);
        filterInfoContainer.appendChild(infoP);
      }
    }

    // ========================================
    // === 초기화 및 이벤트 리스너 설정 ===
    // ========================================
    // ▼▼▼ 초기화 로직 시작 ▼▼▼
    function initializeGallery() {
      // worksData 로드 확인
      if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
          console.error("Initialization failed: worksData is not defined or not an array! Check works-list.js.");
          if (galleryContainer) galleryContainer.innerHTML = '<p id="no-results-message">작품 데이터를 불러올 수 없습니다. 빌드 스크립트를 실행하거나 works-list.js 파일을 확인하세요.</p>';
          // paginationControls가 null이어도 오류 안 나게 처리
          if (paginationControls) paginationControls.innerHTML = '';
          return; // 필수 데이터 없으면 초기화 중단
      }

      // 필수 HTML 요소 확인
      if (!galleryContainer || !mainTitle || !filterInfoContainer || !searchInput || !searchButton || !clearSearchButton || !paginationControls) {
          console.error("Initialization failed: One or more required HTML elements are missing!");
          return; // 필수 요소 없으면 중단
      }

      // 초기 데이터셋 설정
      currentDataSet = [...worksData];

      // 저장된 상태 불러오기
      let savedSearch = null;
      let savedAuthor = null;
      try {
          savedSearch = localStorage.getItem(STORAGE_KEY_SEARCH);
          savedAuthor = localStorage.getItem(STORAGE_KEY_AUTHOR);
      } catch (e) { console.error("Failed to access localStorage", e); }


      // 상태 적용 (작가 우선)
      if (savedAuthor) {
          console.log('Applying saved author filter:', savedAuthor);
          filterGalleryByAuthor(savedAuthor, false);
      } else if (savedSearch) {
          console.log('Applying saved search term:', savedSearch);
          searchInput.value = savedSearch;
          performSearch(false);
      } else {
          renderGallery(); // 저장된 상태 없으면 전체 렌더링
      }

      // 이벤트 리스너 설정
      mainTitle.addEventListener('click', showAllWorks);
      searchButton.addEventListener('click', () => performSearch());
      searchInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') performSearch(); });
      searchInput.addEventListener('input', () => {
          if (searchInput.value === '') {
               clearSearchButton.style.display = 'none';
               showAllWorks();
          } else {
               clearSearchButton.style.display = 'inline-block';
          }
      });
      searchInput.addEventListener('search', () => { if (searchInput.value === '') showAllWorks(); });
      clearSearchButton.addEventListener('click', showAllWorks);

      console.log('Gallery initialized successfully with persistence.');
    }

    // DOM 로드 완료 후 초기화 함수 실행
    if (document.readyState === 'loading') { // 아직 로딩 중이면
        document.addEventListener('DOMContentLoaded', initializeGallery);
    } else { // 이미 로드 완료되었으면
        initializeGallery();
    }
    // ▲▲▲ 초기화 로직 끝 ▲▲▲

  </script>
</body>
</html>
