<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gallery</title>
  <style>
    /* --- 스타일 (이전과 동일) --- */
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 1rem; }
    h1 { text-align: center; cursor: pointer; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; max-width: 1000px; margin: auto; min-height: 300px; }
    .work { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column; }
    .work a { text-decoration: none; color: inherit; display: block; flex-grow: 1; }
    .work:hover { transform: scale(1.02); }
    .work .info-top { padding: 0.75rem; text-align: left; }
    .work .title { font-weight: bold; font-size: 0.95em; display: block; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .work .author { font-size: 0.85em; color: #555; cursor: pointer; display: inline-block; }
    .work .author:hover { text-decoration: underline; color: #007bff; }
    .work img { width: 100%; height: 250px; object-fit: cover; display: block; border-top: 1px solid #eee; margin-top: auto; }
    #search-container { max-width: 1000px; margin: 1rem auto; padding: 10px; background-color: #eee; border-radius: 5px; text-align: center; }
    #search-input { padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 3px; min-width: 250px; }
    #search-button, #clear-search-button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 3px; background-color: #007bff; color: white; vertical-align: middle; }
    #clear-search-button { background-color: #6c757d; margin-left: 5px; }
    .info-message { text-align: center; margin: 1rem 0; font-weight: bold; }
    .info-message button { margin-left: 0.5rem; padding: 5px 10px; cursor: pointer; }
    #no-results-message { text-align: center; margin-top: 20px; color: #777; padding: 2rem; }
    .pagination { text-align: center; margin-top: 2rem; padding: 1rem 0; user-select: none; }
    .pagination button { background-color: #fff; border: 1px solid #ccc; padding: 0.5rem 0.75rem; margin: 0 0.2rem; cursor: pointer; border-radius: 4px; transition: background-color 0.2s, color 0.2s; }
    .pagination button:hover:not(:disabled) { background-color: #eee; }
    .pagination button.active { background-color: #007bff; color: white; border-color: #007bff; font-weight: bold; cursor: default; }
    .pagination button:disabled:not(.active) { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; opacity: 0.65; }
    .pagination .ellipsis { display: inline-block; padding: 0.5rem 0.3rem; margin: 0 0.2rem; color: #6c757d; }
  </style>
</head>
<body>
  <h1 id="main-title">Local Hitomi</h1>

  <div id="search-container">
      <input type="search" id="search-input" placeholder="제목 또는 작가 검색...">
      <button id="search-button">검색</button>
      <button id="clear-search-button" style="display: none;">검색 지우기</button>
  </div>

  <div id="filter-info-container"></div>
  <div class="gallery" id="gallery-container"></div>
  <div id="pagination-controls" class="pagination"></div>

  <script src="works-list.js"></script>

  <script>
    // ========================================
    // === 전역 변수 및 설정 ===
    // ========================================
    const galleryContainer = document.getElementById('gallery-container');
    const mainTitle = document.getElementById('main-title');
    const filterInfoContainer = document.getElementById('filter-info-container');
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const clearSearchButton = document.getElementById('clear-search-button');
    const paginationControls = document.getElementById('pagination-controls');

    // ⭐⭐⭐ URL 해시 상태 관리용 상수 ⭐⭐⭐
    const HASH_AUTHOR_PREFIX = 'author=';
    const HASH_SEARCH_PREFIX = 'search=';

    const baseImageUrl = 'https://pub-2762a42350fa43fba86173c9f291ebcd.r2.dev/';
    const itemsPerPage = 16;
    let currentPage = 1;
    let currentDataSet = [];
    // ⭐ currentFilter는 이제 URL 해시에서 파생됨 (직접 상태 저장 안 함)

    // ========================================
    // === 갤러리 렌더링 (로직 동일, currentFilter 사용 제거) ===
    // ========================================
    function renderGallery() {
        if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
            /* ... 에러 처리 동일 ... */
            if (galleryContainer) galleryContainer.innerHTML = '<p id="no-results-message">작품 데이터 로드 오류.</p>';
            if (paginationControls) paginationControls.innerHTML = '';
            return;
        }
        if (!galleryContainer) { /* ... 에러 처리 동일 ... */ return; }
        galleryContainer.innerHTML = '';

        // ⭐ 필터 정보 표시는 updateFilterInfo에서 URL 기반으로 처리
        updateFilterInfo();

        if (!Array.isArray(currentDataSet)) { /* ... 초기화 동일 ... */ currentDataSet = [...worksData]; }

        const totalItems = currentDataSet.length;
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = currentDataSet.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            let message = '표시할 작품이 없습니다.';
            // ⭐ 현재 상태를 URL에서 파악
            const hashState = parseHash();
            if (hashState.type === 'author') {
                 message = `<strong>'${hashState.value}'</strong> 작가의 작품이 없습니다. <button onclick="navigateToState('all')">전체 보기</button>`;
            } else if (hashState.type === 'search') {
                 message = `<strong>'${hashState.value}'</strong>에 대한 검색 결과가 없습니다. <button onclick="navigateToState('all')">전체 보기</button>`;
            }
            galleryContainer.innerHTML = `<p id="no-results-message">${message}</p>`;
        } else {
             /* ... work 요소 생성 및 추가 로직 동일 ... */
             pageData.forEach(work => {
                 if (!work || !work.id || !work.title || !work.author) { console.error("Invalid item:", work); return; }
                 try {
                    const workDiv = document.createElement('div'); workDiv.className = 'work';
                    const link = document.createElement('a'); link.href = `works/${work.id}/index.html`;
                    const infoDiv = document.createElement('div'); infoDiv.className = 'info-top';
                    const titleSpan = document.createElement('span'); titleSpan.className = 'title'; titleSpan.textContent = work.title; titleSpan.title = work.title;
                    const authorSpan = document.createElement('span'); authorSpan.className = 'author'; authorSpan.textContent = work.author; authorSpan.dataset.author = work.author;
                    // ⭐ 작가 클릭 시 navigateToState 함수 호출
                    authorSpan.addEventListener('click', (event) => {
                        event.preventDefault(); event.stopPropagation();
                        navigateToState('author', work.author);
                    });
                    infoDiv.appendChild(titleSpan); infoDiv.appendChild(authorSpan);
                    const img = document.createElement('img');
                    img.src = work.firstImage ? `${baseImageUrl}works/${work.id}/${work.firstImage}` : '';
                    img.alt = `${work.title} / ${work.author}`; img.loading = 'lazy';
                    img.onerror = function() { this.src=''; this.style.display='none'; console.error("Img load error:", this.src); };
                    link.appendChild(infoDiv); link.appendChild(img);
                    workDiv.appendChild(link); galleryContainer.appendChild(workDiv);
                 } catch(e) { console.error("Render error:", work, e); }
             });
        }
        if (paginationControls) {
            renderPaginationControls();
        } else { /* ... 에러 처리 ... */ }
    }

    // ========================================
    // === 페이지네이션 컨트롤 렌더링 (로직 동일) ===
    // ========================================
    function renderPaginationControls() { /* ... 코드 동일 ... */
        if (!paginationControls) return; paginationControls.innerHTML = '';
        if (typeof worksData === 'undefined' || !Array.isArray(worksData) || !Array.isArray(currentDataSet)) return;
        const totalItems = currentDataSet.length; const totalPages = Math.ceil(totalItems / itemsPerPage); if (totalPages <= 1) return;
        const createButton = (text, pageNum, isDisabled = false, isCurrent = false, isEllipsis = false) => { /* ... 코드 동일 ... */
            if (isEllipsis) { const span = document.createElement('span'); span.className = 'ellipsis'; span.textContent = '...'; return span; }
            const button = document.createElement('button'); button.textContent = text; button.disabled = isDisabled || isCurrent; if (isCurrent) button.classList.add('active'); button.onclick = () => changePage(pageNum); return button;
        };
        paginationControls.appendChild(createButton('이전', currentPage - 1, currentPage === 1));
        const maxPageButtons = 5; let startPage, endPage;
        if (totalPages <= maxPageButtons) { startPage = 1; endPage = totalPages; }
        else { const maxBefore = Math.floor((maxPageButtons - 1) / 2); const maxAfter = Math.ceil((maxPageButtons - 1) / 2); if (currentPage <= maxBefore) { startPage = 1; endPage = maxPageButtons; } else if (currentPage + maxAfter >= totalPages) { startPage = totalPages - maxPageButtons + 1; endPage = totalPages; } else { startPage = currentPage - maxBefore; endPage = currentPage + maxAfter; } }
        if (startPage > 1) { paginationControls.appendChild(createButton('1', 1)); if (startPage > 2) paginationControls.appendChild(createButton('...', 0, false, false, true)); }
        for (let i = startPage; i <= endPage; i++) { paginationControls.appendChild(createButton(i, i, false, i === currentPage)); }
        if (endPage < totalPages) { if (endPage < totalPages - 1) paginationControls.appendChild(createButton('...', 0, false, false, true)); paginationControls.appendChild(createButton(totalPages, totalPages)); }
        paginationControls.appendChild(createButton('다음', currentPage + 1, currentPage === totalPages));
     }

    // ========================================
    // === 페이지 변경 (로직 동일) ===
    // ========================================
    function changePage(newPage) { /* ... 코드 동일 ... */
        const totalPages = Math.ceil(((currentDataSet && currentDataSet.length) || 0) / itemsPerPage);
        if (newPage >= 1 && newPage <= totalPages) {
            currentPage = newPage; renderGallery();
            if (galleryContainer) { const galleryTop = galleryContainer.offsetTop - 20; window.scrollTo({ top: galleryTop, behavior: 'smooth' }); }
        }
    }

    // ========================================
    // === URL 해시 파싱 ===
    // ========================================
    function parseHash() {
        const hash = window.location.hash.substring(1); // # 제거
        if (hash.startsWith(HASH_AUTHOR_PREFIX)) {
            return { type: 'author', value: decodeURIComponent(hash.substring(HASH_AUTHOR_PREFIX.length)) };
        } else if (hash.startsWith(HASH_SEARCH_PREFIX)) {
            return { type: 'search', value: decodeURIComponent(hash.substring(HASH_SEARCH_PREFIX.length)) };
        } else {
            return { type: 'all', value: null }; // 기본 상태 (전체)
        }
    }

    // ========================================
    // === 상태에 따른 데이터 업데이트 ===
    // ========================================
    function applyStateFromHash() {
        const state = parseHash();
        console.log("Applying state from hash:", state);

        if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
             console.error("Cannot apply state: worksData missing.");
             currentDataSet = []; // 데이터 없으면 빈 배열로
             if (searchInput) searchInput.value = '';
             if (clearSearchButton) clearSearchButton.style.display = 'none';
             renderGallery(); // 에러 메시지 표시 위해 호출
             return;
        }

        currentPage = 1; // 상태 변경 시 항상 1페이지부터

        switch (state.type) {
            case 'author':
                currentDataSet = worksData.filter(work => work && work.author === state.value);
                if (searchInput) searchInput.value = ''; // 검색창 비우기
                if (clearSearchButton) clearSearchButton.style.display = 'none';
                break;
            case 'search':
                const searchTerm = state.value.toLowerCase();
                currentDataSet = worksData.filter(work =>
                    work &&
                    ((work.title && work.title.toLowerCase().includes(searchTerm)) ||
                     (work.author && work.author.toLowerCase().includes(searchTerm)))
                );
                if (searchInput) searchInput.value = state.value; // 검색창 채우기
                if (clearSearchButton) clearSearchButton.style.display = state.value ? 'inline-block' : 'none';
                break;
            default: // 'all' 또는 알 수 없는 해시
                currentDataSet = [...worksData];
                if (searchInput) searchInput.value = '';
                if (clearSearchButton) clearSearchButton.style.display = 'none';
                // URL이 완전히 비어있지 않다면 (예: #invalid), 비워주는 것이 좋음
                if(window.location.hash !== '') {
                    // history.replaceState(null, '', window.location.pathname + window.location.search); // # 제거
                }
                break;
        }
        renderGallery(); // 데이터셋 변경 후 렌더링
    }

    // ========================================
    // === URL 상태 변경 및 네비게이션 ===
    // ========================================
    function navigateToState(type, value = null) {
        let newHash = '';
        if (type === 'author' && value) {
            newHash = HASH_AUTHOR_PREFIX + encodeURIComponent(value);
        } else if (type === 'search' && value) {
            newHash = HASH_SEARCH_PREFIX + encodeURIComponent(value);
        }
        // type === 'all' 이거나 위 조건에 안 맞으면 newHash는 '' (전체 보기)

        if (window.location.hash !== '#' + newHash) {
             console.log("Navigating to state:", type, value, "New hash:", newHash);
             // 직접 hash를 변경하면 hashchange 이벤트가 발생함
             window.location.hash = newHash;
             // 만약 hashchange 리스너가 없다면 여기서 applyStateFromHash()를 직접 호출해야 함
        } else {
             console.log("Already at state:", type, value);
             // 이미 해당 상태면 아무것도 안하거나, 강제 리프레시 필요 시 applyStateFromHash() 호출
        }
    }


    // ========================================
    // === 필터링 정보 표시 업데이트 (URL 기반) ===
    // ========================================
    function updateFilterInfo() {
      if (!filterInfoContainer) return;
      filterInfoContainer.innerHTML = '';
      const state = parseHash(); // 현재 URL 상태 확인

      if (state.type === 'author') {
        const infoP = document.createElement('p');
        infoP.className = 'info-message';
        infoP.innerHTML = `<strong>${state.value}</strong> 작가 작품만 보는 중`;
        const showAllButton = document.createElement('button');
        showAllButton.textContent = '전체 보기';
        // 버튼 클릭 시 전체 보기 상태로 네비게이션
        showAllButton.onclick = () => navigateToState('all');
        infoP.appendChild(showAllButton);
        filterInfoContainer.appendChild(infoP);
      }
      // 검색 상태는 검색창에 표시되므로 별도 메시지 없음
    }

    // ========================================
    // === 초기화 및 이벤트 리스너 설정 ===
    // ========================================
    function initializeGallery() {
      // worksData 로드 확인
      if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
          console.error("Init failed: worksData missing!");
          if (galleryContainer) galleryContainer.innerHTML = '<p id="no-results-message">데이터 로드 실패.</p>';
          return;
      }
      // 필수 HTML 요소 확인
      if (!galleryContainer || !mainTitle || !filterInfoContainer || !searchInput || !searchButton || !clearSearchButton || !paginationControls) {
          console.error("Init failed: Required HTML elements missing!");
          return;
      }

      // ⭐ 초기 상태 적용 (URL 해시 기반)
      applyStateFromHash();

      // 이벤트 리스너 설정
      if(mainTitle) mainTitle.addEventListener('click', () => navigateToState('all')); // 제목 클릭 시 전체 보기
      if(searchButton) searchButton.addEventListener('click', () => {
          if(searchInput) navigateToState('search', searchInput.value.trim()); // 검색 버튼 클릭
      });
      if(searchInput) {
          searchInput.addEventListener('keypress', (event) => {
              if (event.key === 'Enter') {
                  navigateToState('search', searchInput.value.trim()); // Enter 키 입력
              }
          });
          searchInput.addEventListener('input', () => {
              // 입력 중에는 바로 상태 변경 안 함. 지우기 버튼 표시 여부만 제어
              if(clearSearchButton) clearSearchButton.style.display = searchInput.value.trim() ? 'inline-block' : 'none';
          });
          searchInput.addEventListener('search', () => { // 검색창의 X 버튼 클릭 시
              if (searchInput.value === '') {
                  navigateToState('all');
              }
          });
      }
      if(clearSearchButton) clearSearchButton.addEventListener('click', () => navigateToState('all')); // 지우기 버튼 클릭 시 전체 보기

      // ⭐ 해시 변경 감지 리스너 (뒤로/앞으로 가기 등)
      window.addEventListener('hashchange', applyStateFromHash);

      console.log('Gallery initialized using URL hash state.');
    }

    // DOM 로드 완료 후 초기화 함수 실행
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeGallery);
    } else {
        initializeGallery();
    }
  </script>
</body>
</html>
