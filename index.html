  <script>
    // ========================================
    // === 전역 변수 및 설정 ===
    // ========================================
    const galleryContainer = document.getElementById('gallery-container');
    const mainTitle = document.getElementById('main-title');
    const filterInfoContainer = document.getElementById('filter-info-container');
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const clearSearchButton = document.getElementById('clear-search-button');
    const paginationControls = document.getElementById('pagination-controls');

    // ⭐⭐⭐ 로컬 스토리지 키 정의 ⭐⭐⭐
    const STORAGE_KEY_SEARCH = 'gallerySearchTerm';
    const STORAGE_KEY_AUTHOR = 'galleryAuthorFilter';

    // ⭐⭐⭐ 외부 이미지 호스팅 기본 URL 설정 (이전에 추가한 부분) ⭐⭐⭐
    const baseImageUrl = 'https://<YOUR_R2_PUBLIC_URL>/'; // 👈 본인의 R2 공개 URL로 변경하세요!

    const itemsPerPage = 16; // 페이지당 항목 수
    let currentPage = 1; // 현재 페이지 번호
    let currentDataSet = []; // 현재 화면에 표시할 전체 데이터셋
    let currentFilter = null; // 현재 필터링 중인 작가 이름

    // ========================================
    // === 갤러리 렌더링 ===
    // ========================================
    function renderGallery() {
      // ... (기존 renderGallery 함수 내용은 동일) ...
      // (이 함수는 데이터셋이 주어지면 화면에 그리는 역할만 함)
        galleryContainer.innerHTML = '';
        updateFilterInfo(); // 필터 정보 업데이트 호출 추가

        if (typeof worksData === 'undefined' || !Array.isArray(worksData)) {
            galleryContainer.innerHTML = '<p id="no-results-message">작품 데이터를 불러올 수 없습니다. 빌드 스크립트를 실행하세요.</p>';
            renderPaginationControls();
            return;
        }

        // currentDataSet 사용 확인
        if (!Array.isArray(currentDataSet)) {
             console.error("currentDataSet is not an array!", currentDataSet);
             currentDataSet = worksData || []; // Fallback to all data if corrupted
        }

        const totalItems = currentDataSet.length;
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = currentDataSet.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            let message = '표시할 작품이 없습니다.';
            if (currentFilter) message = `<strong>'${currentFilter}'</strong> 작가의 작품이 없습니다. <button onclick="showAllWorks()">전체 보기</button>`; // 전체 보기 버튼 추가
            else if (searchInput.value.trim()) message = `<strong>'${searchInput.value.trim()}'</strong>에 대한 검색 결과가 없습니다. <button onclick="showAllWorks()">전체 보기</button>`; // 전체 보기 버튼 추가
            galleryContainer.innerHTML = `<p id="no-results-message">${message}</p>`;
        } else {
            pageData.forEach(work => {
            try {
                const workDiv = document.createElement('div');
                workDiv.className = 'work';
                const link = document.createElement('a');
                link.href = `works/${work.id}/index.html`;
                const infoDiv = document.createElement('div');
                infoDiv.className = 'info-top';
                const titleSpan = document.createElement('span');
                titleSpan.className = 'title';
                titleSpan.textContent = work.title;
                titleSpan.title = work.title;
                const authorSpan = document.createElement('span');
                authorSpan.className = 'author';
                authorSpan.textContent = work.author;
                authorSpan.dataset.author = work.author;
                // ⭐ handleAuthorClick은 그대로 사용 (이벤트 위임 방식으로 변경하면 더 좋지만 일단 유지)
                authorSpan.addEventListener('click', handleAuthorClick);
                infoDiv.appendChild(titleSpan);
                infoDiv.appendChild(authorSpan);
                const img = document.createElement('img');
                if (work.firstImage) {
                    img.src = `${baseImageUrl}works/${work.id}/${work.firstImage}`;
                } else {
                    img.src = '';
                    console.warn(`Work item ${work.id} has no firstImage defined.`);
                }
                img.alt = `${work.title} / ${work.author}`;
                img.loading = 'lazy';
                img.onerror = function() { console.error("Failed to load image:", this.src); this.src=''; /* 오류 시 빈값 또는 대체이미지 */ this.style.display='none'; };
                link.appendChild(infoDiv);
                link.appendChild(img);
                workDiv.appendChild(link);
                galleryContainer.appendChild(workDiv);
            } catch (error) {
                console.error("Error rendering work item:", work, error);
            }
            });
        }
        renderPaginationControls();
    }

    // ========================================
    // === 페이지네이션 컨트롤 렌더링 (개선된 버전) ===
    // ========================================
    // ... (기존 renderPaginationControls 함수 내용은 동일) ...
    function renderPaginationControls() {
        paginationControls.innerHTML = '';
        if (typeof worksData === 'undefined' || !Array.isArray(currentDataSet)) return;

        const totalItems = currentDataSet.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage);

        if (totalPages <= 1) return; // 페이지 1개 이하면 표시 안 함

        const createButton = (text, pageNum, isDisabled = false, isCurrent = false, isEllipsis = false) => {
            if (isEllipsis) {
                const span = document.createElement('span');
                span.className = 'ellipsis';
                span.textContent = '...';
                return span;
            }
            const button = document.createElement('button');
            button.textContent = text;
            button.disabled = isDisabled || isCurrent;
            if (isCurrent) button.classList.add('active');
            button.onclick = () => changePage(pageNum);
            return button;
        };

        paginationControls.appendChild(createButton('이전', currentPage - 1, currentPage === 1));

        const maxPageButtons = 5;
        let startPage, endPage;

        if (totalPages <= maxPageButtons) {
            startPage = 1; endPage = totalPages;
        } else {
            const maxPagesBeforeCurrent = Math.floor((maxPageButtons - 1) / 2);
            const maxPagesAfterCurrent = Math.ceil((maxPageButtons - 1) / 2);
            if (currentPage <= maxPagesBeforeCurrent) {
                startPage = 1; endPage = maxPageButtons;
            } else if (currentPage + maxPagesAfterCurrent >= totalPages) {
                startPage = totalPages - maxPageButtons + 1; endPage = totalPages;
            } else {
                startPage = currentPage - maxPagesBeforeCurrent; endPage = currentPage + maxPagesAfterCurrent;
            }
        }

        if (startPage > 1) {
            paginationControls.appendChild(createButton('1', 1));
            if (startPage > 2) paginationControls.appendChild(createButton('...', 0, false, false, true));
        }
        for (let i = startPage; i <= endPage; i++) {
            paginationControls.appendChild(createButton(i, i, false, i === currentPage));
        }
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) paginationControls.appendChild(createButton('...', 0, false, false, true));
            paginationControls.appendChild(createButton(totalPages, totalPages));
        }

        paginationControls.appendChild(createButton('다음', currentPage + 1, currentPage === totalPages));
    }

    // ========================================
    // === 페이지 변경 ===
    // ========================================
    // ... (기존 changePage 함수 내용은 동일) ...
    function changePage(newPage) {
        const totalPages = Math.ceil((currentDataSet || []).length / itemsPerPage); // currentDataSet null 체크 추가
        if (newPage >= 1 && newPage <= totalPages) {
            currentPage = newPage;
            renderGallery();
            const galleryTop = galleryContainer.offsetTop - 20;
            window.scrollTo({ top: galleryTop, behavior: 'smooth' });
        }
    }

    // ========================================
    // === 데이터 필터링/검색/전체보기 ===
    // ========================================
    function updateDataSet(newDataSet) {
      currentDataSet = newDataSet;
      currentPage = 1; // 데이터셋 변경 시 항상 1페이지로
      renderGallery(); // 변경된 데이터셋으로 렌더링
    }

    // ⭐⭐⭐ 함수 수정: saveState 파라미터 추가 ⭐⭐⭐
    function filterGalleryByAuthor(authorName, saveState = true) {
      currentFilter = authorName;
      searchInput.value = ''; // 검색창 비우기
      clearSearchButton.style.display = 'none'; // 검색 지우기 버튼 숨김

      if (typeof worksData !== 'undefined') {
        updateDataSet(worksData.filter(work => work.author === authorName));
      } else { console.error("Cannot filter: worksData is not defined."); }

      // ⭐⭐⭐ 로컬 스토리지에 상태 저장 ⭐⭐⭐
      if (saveState) {
        localStorage.setItem(STORAGE_KEY_AUTHOR, authorName);
        localStorage.removeItem(STORAGE_KEY_SEARCH); // 다른 상태는 제거
        console.log('Author filter state saved:', authorName);
      }
      updateFilterInfo(); // 필터 정보 업데이트
    }

    // ⭐⭐⭐ 함수 수정: saveState 파라미터 추가 ⭐⭐⭐
    function performSearch(saveState = true) {
      const searchTerm = searchInput.value.trim().toLowerCase();
      currentFilter = null; // 작가 필터 상태 해제
      if (typeof worksData === 'undefined') {
          console.error("Cannot search: worksData is not defined."); return;
      }
      // 검색어가 없으면 전체 보기 실행 (내부에서 스토리지 정리)
      if (!searchTerm) {
        showAllWorks();
        return;
      }

      const filtered = worksData.filter(work =>
          work.title.toLowerCase().includes(searchTerm) || work.author.toLowerCase().includes(searchTerm)
      );
      updateDataSet(filtered);
      clearSearchButton.style.display = 'inline-block'; // 검색 지우기 버튼 표시

      // ⭐⭐⭐ 로컬 스토리지에 상태 저장 ⭐⭐⭐
      if (saveState) {
        localStorage.setItem(STORAGE_KEY_SEARCH, searchInput.value.trim());
        localStorage.removeItem(STORAGE_KEY_AUTHOR); // 다른 상태는 제거
        console.log('Search state saved:', searchInput.value.trim());
      }
       updateFilterInfo(); // 필터 정보 업데이트 (검색 시에는 정보 표시 안 함)
    }

    // ⭐⭐⭐ 함수 수정: 로컬 스토리지 초기화 추가 ⭐⭐⭐
    function showAllWorks() {
      currentFilter = null;
      searchInput.value = '';
      clearSearchButton.style.display = 'none';

      // ⭐⭐⭐ 로컬 스토리지에서 상태 제거 ⭐⭐⭐
      localStorage.removeItem(STORAGE_KEY_SEARCH);
      localStorage.removeItem(STORAGE_KEY_AUTHOR);
      console.log('Saved search/filter state cleared.');

      if (typeof worksData !== 'undefined') {
        updateDataSet(worksData); // 전체 데이터로 업데이트
      } else { console.error("Cannot show all: worksData is not defined."); }
      updateFilterInfo(); // 필터 정보 업데이트
    }

    // ========================================
    // === 이벤트 핸들러 ===
    // ========================================
    function handleAuthorClick(event) {
      event.preventDefault(); // 링크 기본 동작 방지
      event.stopPropagation(); // 이벤트 버블링 방지
      const author = event.target.dataset.author;
      if (author) {
          filterGalleryByAuthor(author); // 상태 저장 O (saveState=true 기본값)
      }
    }

    // ========================================
    // === 필터링 정보 표시 업데이트 ===
    // ========================================
    function updateFilterInfo() {
      filterInfoContainer.innerHTML = ''; // 일단 비우기
      if (currentFilter) { // 작가 필터링 중일 때만 표시
        const infoP = document.createElement('p');
        infoP.className = 'info-message';
        infoP.innerHTML = `<strong>${currentFilter}</strong> 작가 작품만 보는 중`;
        const showAllButton = document.createElement('button');
        showAllButton.textContent = '전체 보기';
        showAllButton.onclick = showAllWorks;
        infoP.appendChild(showAllButton);
        filterInfoContainer.appendChild(infoP);
      }
      // 검색 중일 때는 별도 메시지 표시 안 함 (검색 결과 없다는 메시지는 renderGallery에서 처리)
    }

    // ========================================
    // === 초기화 및 이벤트 리스너 설정 ===
    // ========================================
    document.addEventListener('DOMContentLoaded', () => {
      // ⭐⭐⭐ 페이지 로드 시 로컬 스토리지 확인 및 적용 ⭐⭐⭐
      const savedSearch = localStorage.getItem(STORAGE_KEY_SEARCH);
      const savedAuthor = localStorage.getItem(STORAGE_KEY_AUTHOR);

      if (typeof worksData !== 'undefined' && Array.isArray(worksData)) {
        // 초기 데이터셋은 항상 전체 데이터로 시작
        currentDataSet = [...worksData];

        // 저장된 상태 적용 (작가 필터 우선)
        if (savedAuthor) {
          console.log('Applying saved author filter:', savedAuthor);
          filterGalleryByAuthor(savedAuthor, false); // 상태 저장 X (이미 저장된 값 로드)
        } else if (savedSearch) {
          console.log('Applying saved search term:', savedSearch);
          searchInput.value = savedSearch; // 검색창에 값 설정
          performSearch(false); // 상태 저장 X (이미 저장된 값 로드)
        } else {
          // 저장된 상태 없으면 전체 목록 렌더링
          renderGallery();
        }
      } else {
        // worksData 로드 실패 시 처리
        console.error("worksData is not defined or not an array! Check works-list.js.");
        if (galleryContainer) galleryContainer.innerHTML = '<p id="no-results-message">작품 데이터를 불러올 수 없습니다. 빌드 스크립트를 실행하세요.</p>';
        renderPaginationControls(); // 페이지네이션 비움
      }

      // --- 기존 이벤트 리스너 설정 ---
      if (mainTitle) mainTitle.addEventListener('click', showAllWorks);
      if (searchButton) searchButton.addEventListener('click', () => performSearch()); // 상태 저장 O
      if (searchInput) {
        searchInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') performSearch(); }); // 상태 저장 O
        // 입력 중 실시간 검색 대신, 입력창 비우면 전체보기
        searchInput.addEventListener('input', () => {
            if (searchInput.value === '') {
                // 입력창 비워지면 검색 지우기 버튼 숨기고 전체 보기 (스토리지 초기화 포함)
                 clearSearchButton.style.display = 'none';
                 showAllWorks();
            } else {
                // 입력 중에는 검색 지우기 버튼 표시 (실제 검색은 Enter나 버튼 클릭 시)
                 clearSearchButton.style.display = 'inline-block';
            }
        });
        // 검색창의 'x' 버튼 클릭 감지 (일부 브라우저)
        searchInput.addEventListener('search', () => { if (searchInput.value === '') showAllWorks(); });
      }
      if (clearSearchButton) clearSearchButton.addEventListener('click', showAllWorks); // 상태 저장 X (showAllWorks 내부에서 처리)

      console.log('Gallery initialized with persistence.');
    });

  </script>
</body>
</html>
